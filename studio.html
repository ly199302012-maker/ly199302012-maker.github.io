<script type="module">
const $load=document.getElementById('load');
function fallback(){document.getElementById('fb').style.display='flex';$load.style.display='none';document.getElementById('tip').style.display='none';}
const _c=document.createElement('canvas');
if(!(_c.getContext('webgl2')||_c.getContext('webgl'))){fallback();throw new Error('no webgl');}
let THREE;
try{ THREE=await import('https://registry.npmmirror.com/three/0.160.0/files/build/three.module.min.js'); }
catch(e){ try{ THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js'); }catch(e2){ fallback(); throw e2; } }

let renderer;
try{ renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'}); }catch(e){ fallback(); throw e; }
const isMobile=/iPhone|iPad|Android/i.test(navigator.userAgent)||innerWidth<700;
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const BG=0x140d08;
scene.background=new THREE.Color(BG);
scene.fog=new THREE.FogExp2(BG,0.035);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,80);

// ---------- helpers
const SRGB=THREE.SRGBColorSpace;
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function ctex(c,rep){const t=new THREE.CanvasTexture(c);t.colorSpace=SRGB;t.anisotropy=4;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;}
function std(color,o={}){return new THREE.MeshStandardMaterial(Object.assign({color,roughness:.75,metalness:0},o));}
function emi(color,i=1.5){return new THREE.MeshStandardMaterial({color:0x000000,emissive:color,emissiveIntensity:i,roughness:1});}
const BOX=new THREE.BoxGeometry(1,1,1);
function box(w,h,d,mat,x,y,z,parent=scene,shadow=true){const m=new THREE.Mesh(BOX,mat);m.scale.set(w,h,d);m.position.set(x,y,z);if(shadow){m.castShadow=true;m.receiveShadow=true;}parent.add(m);return m;}
function cyl(rt,rb,h,mat,x,y,z,parent=scene,seg=24){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
const R=(a,b)=>a+Math.random()*(b-a);
// radial glow sprite
const glowTex=(()=>{const c=cv(128,128),g=c.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.25,'rgba(255,255,255,.45)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);return ctex(c);})();
function glow(color,size,x,y,z,op=.6,parent=scene){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false}));s.scale.set(size,size,1);s.position.set(x,y,z);parent.add(s);return s;}

// ---------- textures
function woodFloor(){const c=cv(1024,1024),g=c.getContext('2d');const rows=8,rh=128;
  for(let r=0;r<rows;r++){let x=-R(0,300);while(x<1024){const len=R(260,520);const h=R(22,30),s=R(42,55),l=R(30,42);
      g.fillStyle=`hsl(${h},${s}%,${l}%)`;g.fillRect(x,r*rh,len,rh);
      for(let k=0;k<26;k++){g.strokeStyle=`rgba(${Math.random()<.5?'60,30,10':'255,220,170'},${R(.03,.09)})`;g.lineWidth=R(1,3);g.beginPath();const yy=r*rh+R(4,rh-4);g.moveTo(x,yy);g.bezierCurveTo(x+len*.3,yy+R(-6,6),x+len*.7,yy+R(-6,6),x+len,yy+R(-4,4));g.stroke();}
      g.fillStyle='rgba(20,10,4,.75)';g.fillRect(x,r*rh,3,rh);x+=len;}
    g.fillStyle='rgba(20,10,4,.8)';g.fillRect(0,r*rh,1024,3);}
  return ctex(c,[2.2,2.2]);}
function woodDark(){const c=cv(256,256),g=c.getContext('2d');g.fillStyle='#3a2416';g.fillRect(0,0,256,256);
  for(let k=0;k<90;k++){g.strokeStyle=`rgba(${Math.random()<.5?'15,6,2':'120,75,40'},${R(.08,.22)})`;g.lineWidth=R(.5,2.5);g.beginPath();const y=R(0,256);g.moveTo(0,y);g.bezierCurveTo(80,y+R(-8,8),170,y+R(-8,8),256,y+R(-5,5));g.stroke();}
  return ctex(c,[1,1]);}
function plaster(){const c=cv(256,256),g=c.getContext('2d');g.fillStyle='#5a4535';g.fillRect(0,0,256,256);const d=g.getImageData(0,0,256,256);for(let i=0;i<d.data.length;i+=4){const n=R(-14,14);d.data[i]+=n;d.data[i+1]+=n;d.data[i+2]+=n;}g.putImageData(d,0,0);return ctex(c,[3,2]);}
const darkWood=std(0xffffff,{map:woodDark(),roughness:.6});
const midWood=std(0xb07a4a,{map:woodDark(),roughness:.55});
const wallMat=std(0xffffff,{map:plaster(),roughness:.95});

// ---------- room shell
const floor=new THREE.Mesh(new THREE.PlaneGeometry(10,10),std(0xffffff,{map:woodFloor(),roughness:.5}));
floor.rotation.x=-Math.PI/2;floor.position.set(.5,0,.6);floor.receiveShadow=true;scene.add(floor);
const back=new THREE.Mesh(new THREE.PlaneGeometry(9,5.2),wallMat);back.position.set(.5,2.6,-4);back.receiveShadow=true;scene.add(back);
const left=new THREE.Mesh(new THREE.PlaneGeometry(9.5,5.2),wallMat);left.rotation.y=Math.PI/2;left.position.set(-4,2.6,.75);left.receiveShadow=true;scene.add(left);
// timber frame (Japanese posts & beams)
box(.18,5.2,.18,darkWood,-3.91,2.6,-3.91);
box(9,.2,.16,darkWood,.5,5.1,-3.92);box(.16,.2,9.5,darkWood,-3.92,5.1,.75);
box(9,.12,.06,darkWood,.5,.06,-3.97);box(.06,.12,9.5,darkWood,-3.97,.06,.75);
box(.16,5.2,.16,darkWood,.85,2.6,-3.92);
// ceiling beams (seen when looking up a bit)


// ---------- bookshelf wall
const shelf=new THREE.Group();scene.add(shelf);
const SX0=-2.9,SX1=.7,SD=.44,SZ=-4+SD/2,SH=3.6,BAYS=4,BW=(SX1-SX0)/BAYS;
const ROWY=[.1,.78,1.46,2.14,2.82,3.5];
box(SX1-SX0,SH,.03,std(0x1c110a,{roughness:.9}),(SX0+SX1)/2,SH/2,-3.98,shelf);
for(let i=0;i<=BAYS;i++) box(.05,SH,SD,darkWood,SX0+i*BW,SH/2,SZ,shelf);
ROWY.forEach(y=>box(SX1-SX0+.05,.05,SD,darkWood,(SX0+SX1)/2,y,SZ,shelf));
box(SX1-SX0+.12,.08,SD+.06,darkWood,(SX0+SX1)/2,SH+.04,SZ+.03,shelf);
const glowBays={'1,0':'lantern','2,2':'neon','3,1':'frame','0,3':'orb','4,3':'crystal','4,0':'tvmini'};
{ const pal=[0x7a2a22,0x1f3557,0x8c6a2c,0x4f5a2e,0xd9c9a6,0x2d5f5c,0x5b2b4a,0x2a2a2a,0xa8462a,0x3e4f7a];
  const mats=[],count=260; const inst=new THREE.InstancedMesh(BOX,std(0xffffff,{roughness:.8}),count);
  const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),col=new THREE.Color();let n=0;
  for(let r=0;r<5;r++)for(let b=0;b<BAYS;b++){
    const key=r+','+b; const bx0=SX0+b*BW+.04, bx1=SX0+(b+1)*BW-.04, y0=ROWY[r]+.025, rh=ROWY[r+1]-ROWY[r]-.05;
    let x=bx0; const stopAt=glowBays[key]? bx0+BW*.38 : bx1;
    while(x<stopAt-.03&&n<count){const w=R(.035,.085),h=rh*R(.62,.9),d=SD*R(.68,.85);
      if(x+w>stopAt)break; let lean=0; if(Math.random()<.07&&x+w+.08<stopAt){lean=-.25;}
      e.set(0,0,lean);q.setFromEuler(e);m4.compose(new THREE.Vector3(x+w/2+(lean?.04:0),y0+h/2,SZ+(SD-d)/2-.02),q,new THREE.Vector3(w,h,d));
      inst.setMatrixAt(n,m4);col.setHex(pal[(Math.random()*pal.length)|0]).multiplyScalar(R(.7,1.1));inst.setColorAt(n,col);n++;
      x+=w+(lean?.09:R(0,.006)); if(Math.random()<.04)x+=R(.08,.2);}
  }
  inst.count=n;inst.castShadow=true;inst.receiveShadow=true;shelf.add(inst);
}
function bayCenter(r,b){return [SX0+b*BW+BW*.68, ROWY[r]+.025, SZ+.02];}
const flick=[]; // things that flicker/pulse
{ // lantern
  const [x,y,z]=bayCenter(1,0);const m=cyl(.11,.11,.36,emi(0xffa040,2.2),x,y+.2,z,shelf);
  cyl(.12,.12,.03,darkWood,x,y+.39,z,shelf);cyl(.12,.12,.03,darkWood,x,y+.01,z,shelf);
  flick.push({m,base:2.2,sp:3});glow(0xff9030,1,x,y+.2,z+.2,.55,shelf);
}
{ // neon 蓝
  const [x,y,z]=bayCenter(2,2);const c=cv(128,128),g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,128,128);
  g.font='bold 92px "PingFang SC",sans-serif';g.textAlign='center';g.textBaseline='middle';g.shadowColor='#3aa0ff';g.shadowBlur=18;g.fillStyle='#bfe2ff';g.fillText('蓝',64,70);
  const p=new THREE.Mesh(new THREE.PlaneGeometry(.4,.4),new THREE.MeshBasicMaterial({map:ctex(c),blending:THREE.AdditiveBlending,transparent:true}));p.position.set(x,y+.3,z);shelf.add(p);
  glow(0x3a8cff,1.1,x,y+.3,z+.15,.5,shelf);flick.push({mat:p.material,neon:true});
}
const stickerImg=new Image();stickerImg.src='holo-cike.png';
const imgReady=new Promise(ok=>{stickerImg.onload=()=>ok(true);stickerImg.onerror=()=>ok(false);});
{ // framed sticker
  const [x,y,z]=bayCenter(3,1);box(.4,.48,.04,std(0x1a1a1a),x,y+.27,z-.06,shelf);
  const c=cv(256,300),g=c.getContext('2d');const t=ctex(c);
  imgReady.then(ok=>{const gr=g.createLinearGradient(0,0,0,300);gr.addColorStop(0,'#2a5ea8');gr.addColorStop(1,'#0c1a35');g.fillStyle=gr;g.fillRect(0,0,256,300);if(ok){const s=Math.min(230/stickerImg.width,270/stickerImg.height);g.drawImage(stickerImg,128-stickerImg.width*s/2,150-stickerImg.height*s/2,stickerImg.width*s,stickerImg.height*s);}t.needsUpdate=true;});
  const p=new THREE.Mesh(new THREE.PlaneGeometry(.34,.42),new THREE.MeshBasicMaterial({map:t}));p.position.set(x,y+.27,z-.035);shelf.add(p);
  glow(0x4a90ff,.8,x,y+.27,z+.1,.35,shelf);
}
{ // orb
  const [x,y,z]=bayCenter(0,3);const m=new THREE.Mesh(new THREE.SphereGeometry(.14,24,16),emi(0xff3fa0,2));m.position.set(x,y+.2,z);shelf.add(m);
  cyl(.1,.12,.06,std(0x222222,{metalness:.6,roughness:.4}),x,y+.03,z,shelf);glow(0xff3fa0,1.1,x,y+.2,z+.1,.6,shelf);flick.push({m,base:2,sp:1.2});
}
{ // crystal
  const [x,y,z]=bayCenter(4,3);const m=new THREE.Mesh(new THREE.OctahedronGeometry(.14),emi(0x40fff0,1.8));m.position.set(x,y+.22,z);shelf.add(m);
  glow(0x40fff0,.9,x,y+.22,z+.1,.5,shelf);flick.push({m,base:1.8,sp:.8,spin:true});
}
{ // tiny cassette stack + glowing clock
  const [x,y,z]=bayCenter(4,0);for(let i=0;i<4;i++)box(.24,.05,.15,std([0xd94f3a,0xf1e3c8,0x2f4f8f,0x111111][i]),x,y+.03+i*.055,z,shelf);
  const c=cv(128,48),g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,128,48);g.font='bold 34px monospace';g.fillStyle='#3cff7a';g.shadowColor='#3cff7a';g.shadowBlur=10;g.textAlign='center';g.fillText('23:59',64,36);
  box(.24,.1,.12,std(0x151515),x,y+.29,z,shelf);const p=new THREE.Mesh(new THREE.PlaneGeometry(.21,.075),new THREE.MeshBasicMaterial({map:ctex(c)}));p.position.set(x,y+.29,z+.061);shelf.add(p);
}

// ---------- staircase (open treads along left wall) + landing
const stairs=new THREE.Group();scene.add(stairs);
{ const N=10,rise=.3,run=.38,x0=-4,w=1.0,zStart=.55;
  for(let i=0;i<N;i++){const y=(i+1)*rise,z=zStart-i*run;box(w,.07,run+.02,midWood,x0+w/2,y-.035,z-run/2,stairs);}
  const len=Math.hypot(N*rise,N*run),ang=Math.atan2(N*rise,N*run);
  const s=box(.07,.26,len+.3,darkWood,x0+w+.02,N*rise/2,zStart-N*run/2,stairs);s.rotation.x=ang;
  box(w,.12,.5,midWood,x0+w/2,N*rise-.06,-3.75,stairs);
  // handrail
  const hr=box(.05,.05,len,darkWood,x0+w+.02,N*rise/2+.9,zStart-N*run/2,stairs);hr.rotation.x=ang;
  for(let i=0;i<N;i+=2){const y=(i+1)*rise,z=zStart-i*run-run/2;box(.03,.9,.03,darkWood,x0+w+.02,y+.45,z,stairs);}
  // glowing doorway upstairs
  const door=new THREE.Mesh(new THREE.PlaneGeometry(.8,1.7),emi(0xffcf8a,1.3));door.position.set(-3.5,N*rise+.85,-3.97);stairs.add(door);
  box(.06,1.8,.06,darkWood,-3.92,N*rise+.9,-3.94,stairs);box(.06,1.8,.06,darkWood,-3.08,N*rise+.9,-3.94,stairs);box(.9,.06,.06,darkWood,-3.5,N*rise+1.78,-3.94,stairs);
  for(let k=1;k<4;k++)box(.02,1.7,.02,darkWood,-3.9+k*.2,N*rise+.85,-3.95,stairs,false);
  for(let k=1;k<5;k++)box(.8,.02,.02,darkWood,-3.5,N*rise+k*.34,-3.95,stairs,false);
}

// ---------- shoji sliding doors (left wall, backlit)
const shoji=new THREE.Group();scene.add(shoji);
const paperMat=new THREE.MeshStandardMaterial({color:0x2a2018,emissive:0xffe2b0,emissiveIntensity:1.05,roughness:1});
function shojiPanel(zc,xoff){const g=new THREE.Group();g.position.set(-3.96+xoff,0,zc);const W=1.45,H=2.6,y0=.12;
  const paper=new THREE.Mesh(new THREE.PlaneGeometry(W,H),paperMat);paper.rotation.y=Math.PI/2;paper.position.set(0,y0+H/2,0);g.add(paper);
  const fm=darkWood;box(.06,H+.08,.07,fm,.03,y0+H/2,-W/2,g);box(.06,H+.08,.07,fm,.03,y0+H/2,W/2,g);box(.06,.07,W,fm,.03,y0,0,g);box(.06,.07,W,fm,.03,y0+H,0,g);
  for(let k=1;k<4;k++)box(.03,H,.022,fm,.03,y0+H/2,-W/2+k*W/4,g,false);
  for(let k=1;k<7;k++)box(.03,.022,W,fm,.03,y0+k*H/7,0,g,false);
  box(.05,.35,W,fm,.03,y0+.2,0,g,false);shoji.add(g);}
shojiPanel(1.75,0);shojiPanel(3.05,.07);
box(.16,.12,3.2,darkWood,-3.9,2.86,2.4,shoji);box(.16,.06,3.2,darkWood,-3.9,.04,2.4,shoji);
glow(0xffd9a0,3.2,-3.6,1.5,2.4,.18,shoji);

// ---------- TV wall
const tvGroup=new THREE.Group();scene.add(tvGroup);
box(3.1,.45,.6,darkWood,2.42,.225,-3.68,tvGroup);
const screens=[];
const plastic=[std(0x2b2723,{roughness:.5}),std(0x6b6257,{roughness:.55}),std(0xc9bda7,{roughness:.6}),std(0x1a1a1c,{roughness:.45})];
function makeTV(x,y,w,h,d,kind,col,rot=0){const g=new THREE.Group();g.position.set(x,y,-4+d/2+.08);g.rotation.y=rot;tvGroup.add(g);
  const body=plastic[col];box(w,h,d,body,0,0,0,g);
  box(w*.88,h*.82,d*.6,body,0,0,-d*.55,g); // CRT back bulge
  const sw=w*.7,sh=h*.76;
  box(sw+.05,sh+.05,.02,std(0x050505,{roughness:.3}),-w*.11,0,d/2+.005,g,false);
  const c=cv(256,192),t=ctex(c);const sc=new THREE.Mesh(new THREE.PlaneGeometry(sw,sh),new THREE.MeshBasicMaterial({map:t,toneMapped:false}));
  sc.position.set(-w*.11,0,d/2+.018);g.add(sc);
  for(let k=0;k<2;k++){const kn=cyl(.035,.035,.04,std(0x0e0e0e),w*.36,h*.18-k*.2,d/2+.02,g,12);kn.rotation.x=Math.PI/2;}
  box(w*.12,.012,.01,std(0x111111),w*.36,-h*.3,d/2+.006,g,false);

  const s=Math.sin(cur.p);camera.position.set(target.x+cur.r*s*Math.sin(cur.t),target.y+cur.r*Math.cos(cur.p),target.z+cur.r*s*Math.cos(cur.t));camera.lookAt(target);}
