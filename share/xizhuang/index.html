<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>西装刺客养成</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap"
    />
    <link rel="stylesheet" href="hark.css" />
    <link rel="stylesheet" href="hark-hero.css" />
    <style>
      html, body { overflow: hidden; overscroll-behavior: none; height: 100%; }

      .x-app {
        position: fixed; inset: 0; z-index: 1;
        display: flex; justify-content: center;
        background: #111;
        font: var(--type-body); color: var(--text-primary);
        -webkit-tap-highlight-color: transparent;
      }
      .x-shell {
        position: relative; width: 100%; max-width: 480px; height: 100%;
        display: flex; flex-direction: column; overflow: hidden;
      }

      /* ---------- scenes ---------- */
      .x-bg { position: absolute; inset: 0; z-index: 0; }
      .x-scene { position: absolute; inset: 0; opacity: 0; transition: opacity 600ms var(--ease-out); overflow: hidden; }
      .x-scene.is-on { opacity: 1; }
      .x-scene > i { position: absolute; display: block; }

      /* 写字楼大堂 */
      .x-lobby {
        background:
          linear-gradient(115deg, transparent 40%, rgb(255 255 255 / 0.35) 41%, transparent 43%),
          linear-gradient(70deg, transparent 62%, rgb(190 170 140 / 0.25) 63%, transparent 64.5%),
          linear-gradient(160deg, transparent 20%, rgb(200 180 150 / 0.2) 21%, transparent 22%),
          linear-gradient(180deg, #f6eee2 0%, #eadcc6 62%, #d9c6a8 62.2%, #e8dac3 100%);
      }
      .x-lobby .col { top: 0; bottom: 38%; width: 14%; background: linear-gradient(90deg, #e2d2b8, #f8f1e6 45%, #d6c3a3); box-shadow: 0 0 30px rgb(120 90 50 / 0.15); }
      .x-lobby .col.l { left: 6%; } .x-lobby .col.r { right: 6%; }
      .x-lobby .light { top: -10%; left: 20%; right: 20%; height: 55%; background: radial-gradient(ellipse at 50% 0%, rgb(255 236 200 / 0.9), transparent 70%); }
      .x-lobby .floor { left: 0; right: 0; bottom: 0; height: 38%; background: repeating-linear-gradient(90deg, transparent 0 24%, rgb(160 130 90 / 0.18) 24% 24.4%); }

      /* 雨夜街头 */
      .x-rain { background: linear-gradient(180deg, #070b1d 0%, #0f1b3d 55%, #1a2350 100%); }
      .x-rain .glow-p { left: -20%; top: 18%; width: 80%; height: 45%; background: radial-gradient(circle, rgb(255 60 170 / 0.55), transparent 65%); filter: blur(8px); }
      .x-rain .glow-c { right: -25%; top: 8%; width: 85%; height: 50%; background: radial-gradient(circle, rgb(40 230 255 / 0.45), transparent 65%); filter: blur(8px); }
      .x-rain .bldg { bottom: 30%; background: #060914; }
      .x-rain .b1 { left: 0; width: 28%; height: 40%; }
      .x-rain .b2 { left: 30%; width: 18%; height: 28%; }
      .x-rain .b3 { right: 0; width: 34%; height: 48%; }
      .x-rain .sign-p { left: 6%; bottom: 58%; width: 16%; height: 4px; border-radius: 4px; background: #ff4fbf; box-shadow: 0 0 12px #ff4fbf, 0 0 28px #ff4fbf; }
      .x-rain .sign-c { right: 8%; bottom: 66%; width: 6px; height: 12%; border-radius: 4px; background: #39e6ff; box-shadow: 0 0 12px #39e6ff, 0 0 28px #39e6ff; }
      .x-rain .street { left: 0; right: 0; bottom: 0; height: 30%; background: linear-gradient(180deg, #121a3a, #0a0f24); }
      .x-rain .street::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgb(255 79 191 / 0.18), transparent 40%, transparent 60%, rgb(57 230 255 / 0.18)); }
      .x-drop { position: absolute; top: -40px; width: 1.5px; height: 28px; background: linear-gradient(180deg, transparent, rgb(200 230 255 / 0.6)); transform: rotate(12deg); animation: x-fall linear infinite; }
      @keyframes x-fall { to { transform: translate(-90px, 110vh) rotate(12deg); } }

      /* 裁缝店 */
      .x-tailor {
        background:
          repeating-linear-gradient(90deg, transparent 0 58px, rgb(40 20 8 / 0.25) 58px 60px),
          linear-gradient(180deg, #8a5a36 0%, #6e4426 64%, #4a2c17 64.3%, #5c3920 100%);
      }
      .x-tailor .shelf { left: 6%; right: 6%; height: 10px; border-radius: 3px; background: #3d2412; box-shadow: 0 4px 10px rgb(0 0 0 / 0.3); }
      .x-tailor .s1 { top: 16%; } .x-tailor .s2 { top: 34%; }
      .x-tailor .roll { width: 13%; height: 9%; border-radius: 8px 8px 3px 3px; }
      .x-tailor .lamp { left: 25%; right: 25%; top: -15%; height: 45%; background: radial-gradient(ellipse at 50% 0%, rgb(255 210 140 / 0.55), transparent 70%); }
      .x-tailor .tape { left: 0; right: 0; bottom: 33%; height: 8px; background: repeating-linear-gradient(90deg, #f2d36b 0 10px, #e2c055 10px 11px); opacity: 0.8; }

      /* 咖啡店 */
      .x-cafe { background: linear-gradient(180deg, #f6ecdc 0%, #eedfc6 60%, #6f4a32 60.3%, #5a3a26 100%); }
      .x-cafe .board { left: 10%; top: 10%; width: 38%; height: 22%; border-radius: 10px; background: #3b2f2a; box-shadow: inset 0 0 0 5px #8b6a4d; }
      .x-cafe .board::before { content: ""; position: absolute; left: 18%; right: 18%; top: 28%; height: 44%; background: repeating-linear-gradient(180deg, rgb(255 255 255 / 0.55) 0 2px, transparent 2px 12px); }
      .x-cafe .lamp { top: 0; width: 2px; height: 16%; background: #4a3326; }
      .x-cafe .lamp::after { content: ""; position: absolute; left: -16px; bottom: -14px; width: 34px; height: 18px; border-radius: 18px 18px 4px 4px; background: #c7843f; box-shadow: 0 18px 40px 10px rgb(255 200 120 / 0.45); }
      .x-cafe .l1 { left: 62%; } .x-cafe .l2 { left: 82%; height: 22%; }
      .x-cafe .counter { left: 0; right: 0; bottom: 40%; height: 14px; background: #c9a77f; }
      .x-cafe .cup { right: 12%; bottom: calc(40% + 14px); width: 30px; height: 26px; border-radius: 0 0 10px 10px; background: #fffaf2; }
      .x-cafe .cup::after { content: ""; position: absolute; right: -9px; top: 5px; width: 10px; height: 12px; border: 3px solid #fffaf2; border-left: none; border-radius: 0 8px 8px 0; }

      /* ---------- top bar ---------- */
      .x-top {
        position: relative; z-index: 3; margin: max(10px, env(safe-area-inset-top)) 12px 0;
        display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px;
        background: var(--mat-agent); backdrop-filter: var(--hark-blur); -webkit-backdrop-filter: var(--hark-blur);
        border: 1px solid var(--stroke-composer); border-radius: var(--r-pill); box-shadow: var(--hark-shadow);
      }
      .x-title { font: var(--type-label); font-weight: var(--weight-bold); white-space: nowrap; margin: 0; }
      .x-favor { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; position: relative; }
      .x-heart { width: 18px; height: 18px; flex: none; color: #ff4d7d; transition: transform var(--dur-quick) var(--ease-out); }
      .x-heart.beat { animation: x-beat 420ms var(--ease-out); }
      @keyframes x-beat { 40% { transform: scale(1.35); } }
      .x-track { flex: 1; height: 8px; border-radius: var(--r-pill); background: var(--fill-tertiary); overflow: hidden; }
      .x-fill { height: 100%; width: 20%; border-radius: inherit; background: linear-gradient(90deg, #ff8fb1, #ff4d7d); transition: width 500ms var(--ease-out); }
      .x-num { font: var(--type-tag); font-variant-numeric: tabular-nums; min-width: 26px; text-align: right; }
      .x-float { position: absolute; right: 30px; top: -4px; font: var(--type-label); font-weight: var(--weight-bold); pointer-events: none; animation: x-up 1100ms var(--ease-out) forwards; }
      .x-float.up { color: #ff4d7d; } .x-float.down { color: var(--fill-system-red); }
      @keyframes x-up { 0% { opacity: 0; transform: translateY(6px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-28px); } }

      .x-iconbtn {
        flex: none; min-width: var(--tap); height: var(--tap); padding: 0 12px; border: 0; border-radius: var(--r-pill);
        display: inline-flex; align-items: center; justify-content: center; gap: 4px;
        background: var(--fill-primary); color: var(--text-primary-on); font: var(--type-tag); cursor: pointer;
      }

      /* ---------- stage ---------- */
      .x-stage { position: relative; z-index: 1; flex: 1; min-height: 0; }
      .x-bubble {
        position: absolute; z-index: 2; left: 16px; right: 16px; top: 12px; margin: 0 auto; max-width: 340px;
        padding: 12px 16px; min-height: 48px;
        background: var(--mat-agent); backdrop-filter: var(--hark-blur); -webkit-backdrop-filter: var(--hark-blur);
        border: 1px solid var(--stroke-composer); border-radius: var(--r-l); box-shadow: var(--hark-shadow);
        font: var(--type-body-strong); font-size: var(--size-prose); text-align: center;
      }
      .x-bubble::after {
        content: ""; position: absolute; left: 50%; bottom: -8px; width: 16px; height: 16px; margin-left: -8px;
        background: inherit; border-right: 1px solid var(--stroke-composer); border-bottom: 1px solid var(--stroke-composer);
        transform: rotate(45deg); backdrop-filter: none; -webkit-backdrop-filter: none;
      }
      .x-bubble .caret { display: inline-block; width: 2px; height: 1em; margin-left: 2px; vertical-align: -2px; background: currentColor; animation: x-blink 800ms steps(1) infinite; }
      @keyframes x-blink { 50% { opacity: 0; } }

      .x-char {
        position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
        width: 100%; height: min(60dvh, calc(100% - 84px));
        border: 0; padding: 0; background: none; cursor: pointer;
      }
      .x-shadow { position: absolute; left: 22%; right: 22%; bottom: -10px; height: 34px; border-radius: 50%; background: radial-gradient(ellipse, rgb(0 0 0 / 0.38), transparent 70%); }
      .x-look, .x-sway, .x-react, .x-pop, .x-breath, .x-expr { position: absolute; inset: 0; transform-origin: 50% 100%; }
      .x-look { transition: transform 900ms var(--ease-out); }
      .x-sway { animation: x-swaykf 6.5s ease-in-out infinite; }
      @keyframes x-swaykf {
        0%, 100% { transform: none; }
        22% { transform: rotate(0.8deg) translateX(-2px); }
        47% { transform: rotate(-0.25deg) translateX(3px); }
        70% { transform: rotate(-0.8deg) translateX(1px); }
        87% { transform: rotate(0.3deg) translateX(-3px); }
      }
      .x-react.hop { animation: x-hop 560ms var(--ease-out); }
      @keyframes x-hop { 0% { transform: none; } 30% { transform: translateY(-10px) scale(0.99, 1.01); } 55% { transform: translateY(0) scale(1.02, 0.98); } 72% { transform: translateY(-3px); } 100% { transform: none; } }
      .x-react.shake { animation: x-shake 400ms linear; }
      @keyframes x-shake { 10% { transform: translateX(-7px); } 25% { transform: translateX(6px); } 40% { transform: translateX(-5px); } 55% { transform: translateX(4px); } 70% { transform: translateX(-2px); } 85% { transform: translateX(1px); } 100% { transform: none; } }
      .x-pop.go { animation: x-popkf 420ms var(--ease-out); }
      @keyframes x-popkf { 0% { transform: scale(0.94, 1.04); } 45% { transform: scale(1.05, 0.96) translateY(-6px); } 75% { transform: scale(0.99, 1.01); } 100% { transform: none; } }
      .x-breath { animation: x-breathe 3.6s ease-in-out infinite; }
      @keyframes x-breathe { 50% { transform: scale(1.012); } }
      .x-expr {
        opacity: 0; visibility: hidden;
        transition: opacity 180ms linear, visibility 0s linear 180ms;
        filter: drop-shadow(0 10px 18px rgb(0 0 0 / 0.18));
      }
      .x-expr.is-on { opacity: 1; visibility: visible; transition: opacity 180ms linear, visibility 0s; }
      .x-expr.is-in { animation: x-swap 220ms var(--ease-out); }
      @keyframes x-swap { 0% { transform: scale(0.985); } 55% { transform: scale(1.018); } 100% { transform: none; } }
      .x-expr img {
        position: absolute; inset: 0; width: 100%; height: 100%; max-width: none;
        object-fit: contain; object-position: 50% 100%;
        pointer-events: none; user-select: none; -webkit-user-drag: none;
      }
      .x-expr .x-f-talk, .x-expr .x-f-blink { opacity: 0; }
      .x-expr .x-f-talk.on, .x-expr .x-f-blink.on { opacity: 1; }

      /* reaction particles */
      .x-fx { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
      .x-fx > span { position: absolute; display: block; pointer-events: none; }
      .x-hrt { width: 18px; height: 18px; margin: -9px; color: #ff8fb1; opacity: 0; animation: x-hrtkf 1400ms var(--ease-out) forwards; }
      .x-hrt svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 2px 4px rgb(255 77 125 / 0.35)); }
      @keyframes x-hrtkf {
        0% { opacity: 0; transform: translate(0, 0) scale(0.4); }
        15% { opacity: 1; transform: translate(calc(var(--dx) * 0.2), -14px) scale(1); }
        100% { opacity: 0; transform: translate(var(--dx), -110px) scale(0.85) rotate(var(--rot)); }
      }
      .x-anger { font-size: 28px; line-height: 1; margin: -14px; color: #ff6b6b; text-shadow: 0 0 2px rgb(255 255 255 / 0.9); animation: x-angerkf 950ms var(--ease-out) forwards; }
      @keyframes x-angerkf { 0% { opacity: 0; transform: scale(0.2); } 20% { opacity: 1; transform: scale(1.25); } 35% { transform: scale(0.95); } 50% { transform: scale(1.08); } 72% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.1); } }
      .x-ripple { width: 56px; height: 56px; margin: -28px; border-radius: 50%; border: 2px solid rgb(255 255 255 / 0.9); box-shadow: 0 0 0 1px rgb(0 0 0 / 0.12); animation: x-ripplekf 540ms ease-out forwards; }
      @keyframes x-ripplekf { 0% { opacity: 1; transform: scale(0.2); } 100% { opacity: 0; transform: scale(1.4); } }
      .x-spark { font-size: var(--sz); line-height: 1; margin: -0.5em; color: #ffd76a; text-shadow: 0 0 8px rgb(255 200 80 / 0.85); opacity: 0; animation: x-sparkkf 1000ms var(--ease-out) forwards; }
      @keyframes x-sparkkf { 0% { opacity: 0; transform: scale(0) rotate(0deg); } 35% { opacity: 1; transform: scale(1.15) rotate(45deg); } 100% { opacity: 0; transform: translateY(-16px) scale(0.3) rotate(110deg); } }

      .x-toast {
        position: absolute; z-index: 5; left: 50%; top: 74px; transform: translate(-50%, -10px); opacity: 0;
        padding: 10px 16px; border-radius: var(--r-pill); white-space: nowrap;
        background: var(--fill-primary); color: var(--text-primary-on); font: var(--type-label);
        transition: opacity 260ms var(--ease-out), transform 260ms var(--ease-out); pointer-events: none;
      }
      .x-toast.show { opacity: 1; transform: translate(-50%, 0); }
      .x-scenename {
        position: absolute; z-index: 4; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(0.96); opacity: 0;
        padding: 12px 22px; border-radius: var(--r-m);
        background: var(--mat-regular); backdrop-filter: var(--hark-blur); -webkit-backdrop-filter: var(--hark-blur);
        border: 1px solid var(--stroke-composer); font: var(--type-heading); pointer-events: none;
        transition: opacity 300ms var(--ease-out), transform 300ms var(--ease-out);
      }
      .x-scenename.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

      /* ---------- controls ---------- */
      .x-panel {
        position: relative; z-index: 3; margin: 0 8px max(8px, env(safe-area-inset-bottom)); padding: 8px 0 8px;
        background: var(--mat-agent); backdrop-filter: var(--hark-blur); -webkit-backdrop-filter: var(--hark-blur);
        border: 1px solid var(--stroke-composer); border-radius: var(--r-xl); box-shadow: var(--hark-shadow);
        display: flex; flex-direction: column; gap: 8px;
      }
      .x-chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 10px; scrollbar-width: none; scroll-snap-type: x proximity; }
      .x-chips::-webkit-scrollbar { display: none; }
      .x-chip {
        flex: none; height: var(--tap); padding: 0 14px; border-radius: var(--r-pill); scroll-snap-align: start;
        border: 1px solid var(--stroke-primary); background: var(--fill-primary-on); color: var(--text-primary);
        font: var(--type-label); cursor: pointer; transition: background var(--dur-quick), color var(--dur-quick);
      }
      .x-chip[aria-pressed="true"] { background: var(--fill-primary); color: var(--text-primary-on); border-color: transparent; }
      .x-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 0 10px; }
      .x-act {
        height: 48px; border: 0; border-radius: var(--r-m); background: var(--fill-tertiary); color: var(--text-primary);
        font: var(--type-label); cursor: pointer; padding: 0 4px; transition: transform var(--dur-quick) var(--ease-out);
      }
      .x-act:active, .x-chip:active, .x-iconbtn:active { transform: scale(0.95); }
      .x-act.primary { background: var(--fill-primary); color: var(--text-primary-on); }
      .x-act[aria-pressed="true"] { background: var(--fill-primary); color: var(--text-primary-on); box-shadow: inset 0 0 0 3px var(--fill-system-green); }
      .x-form { display: flex; gap: 6px; padding: 0 10px; margin: 0; }
      .x-input {
        flex: 1; min-width: 0; height: 48px; padding: 0 16px; border-radius: var(--r-pill);
        border: 1px solid var(--stroke-primary); background: var(--fill-primary-on); color: var(--text-primary);
        font: var(--type-body); font-size: 16px; outline: none;
      }
      .x-input:focus { border-color: var(--text-secondary); }
      .x-send { height: 48px; padding: 0 20px; border: 0; border-radius: var(--r-pill); background: var(--fill-primary); color: var(--text-primary-on); font: var(--type-label); cursor: pointer; }

      @media (max-height: 700px) {
        .x-act, .x-input, .x-send { height: var(--tap); }
        .x-char { height: min(56dvh, calc(100% - 76px)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .x-breath, .x-drop, .x-pop.go, .x-sway, .x-react.hop, .x-react.shake, .x-expr.is-in { animation: none; }
        .x-look { transition: none; transform: none !important; }
        .x-fx { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="page" id="top">
      <main class="x-app" aria-label="西装刺客养成">
        <div class="x-shell">
          <div class="x-bg" aria-hidden="true">
            <div class="x-scene x-lobby is-on"><i class="light"></i><i class="col l"></i><i class="col r"></i><i class="floor"></i></div>
            <div class="x-scene x-rain" id="rainScene"><i class="glow-p"></i><i class="glow-c"></i><i class="bldg b1"></i><i class="bldg b2"></i><i class="bldg b3"></i><i class="sign-p"></i><i class="sign-c"></i><i class="street"></i></div>
            <div class="x-scene x-tailor">
              <i class="lamp"></i><i class="shelf s1"></i><i class="shelf s2"></i>
              <i class="roll" style="left:10%;top:7%;background:#22262e"></i>
              <i class="roll" style="left:25%;top:7%;background:#5a6070"></i>
              <i class="roll" style="left:62%;top:7%;background:#8c2f2f"></i>
              <i class="roll" style="left:77%;top:7%;background:#cdbb9a"></i>
              <i class="roll" style="left:14%;top:25%;background:#2c3550"></i>
              <i class="roll" style="left:70%;top:25%;background:#111"></i>
              <i class="tape"></i>
            </div>
            <div class="x-scene x-cafe"><i class="board"></i><i class="lamp l1"></i><i class="lamp l2"></i><i class="counter"></i><i class="cup"></i></div>
          </div>

          <header class="x-top">
            <h1 class="x-title">西装刺客</h1>
            <div class="x-favor" id="favor" role="meter" aria-label="好感度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="20">
              <svg class="x-heart" id="heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>
              <div class="x-track"><div class="x-fill" id="fill"></div></div>
              <span class="x-num" id="num">20</span>
            </div>
            <button class="x-iconbtn" id="sceneBtn" type="button" aria-label="切换背景">
              <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 5h16v14H4zM4 15l5-5 4 4 3-3 4 4"/></svg>场景
            </button>
          </header>

          <section class="x-stage">
            <p class="x-bubble" id="bubble" aria-live="polite"><span id="line"></span><span class="caret" id="caret"></span></p>
            <button class="x-char" id="char" type="button" aria-label="戳一戳西装刺客">
              <span class="x-shadow"></span>
              <span class="x-look" id="look"><span class="x-sway"><span class="x-react" id="react">
              <span class="x-pop" id="pop">
                <span class="x-breath">
                  <span class="x-expr is-on" data-expr="cold"><img src="xz_cold.png" alt="西装刺客，冷脸" /><img class="x-f-talk" src="xz_cold_talk.png" alt="" /><img class="x-f-blink" src="xz_cold_blink.png" alt="" /></span>
                  <span class="x-expr" data-expr="rock"><img src="xz_rock.png" alt="西装刺客，比摇滚手势" /><img class="x-f-talk" src="xz_rock_talk.png" alt="" /><img class="x-f-blink" src="xz_rock_blink.png" alt="" /></span>
                  <span class="x-expr" data-expr="confident"><img src="xz_confident.png" alt="西装刺客，手按胸口一脸拿捏" /><img class="x-f-talk" src="xz_confident_talk.png" alt="" /><img class="x-f-blink" src="xz_confident_blink.png" alt="" /></span>
                  <span class="x-expr" data-expr="shock"><img src="xz_shock.png" alt="西装刺客，震惊流汗" /><img class="x-f-talk" src="xz_shock_talk.png" alt="" /><img class="x-f-blink" src="xz_shock_blink.png" alt="" /></span>
                  <span class="x-expr" data-expr="fakesmile"><img src="xz_fakesmile.png" alt="西装刺客，双手合十假笑" /><img class="x-f-talk" src="xz_fakesmile_talk.png" alt="" /><img class="x-f-blink" src="xz_fakesmile_blink.png" alt="" /></span>
                  <span class="x-expr" data-expr="sneaky"><img src="xz_sneaky.png" alt="西装刺客，手指抵唇偷看" /><img class="x-f-talk" src="xz_sneaky_talk.png" alt="" /><img class="x-f-blink" src="xz_sneaky_blink.png" alt="" /></span>
                  <span class="x-expr" data-expr="cool"><img src="xz_cool.png" alt="西装刺客，戴墨镜拿咖啡" /><img class="x-f-talk" src="xz_cool_talk.png" alt="" /><img class="x-f-blink" src="xz_cool_blink.png" alt="" /></span>
                  <span class="x-expr" data-expr="shrug"><img src="xz_shrug.png" alt="西装刺客，摊手" /><img class="x-f-talk" src="xz_shrug_talk.png" alt="" /><img class="x-f-blink" src="xz_shrug_blink.png" alt="" /></span>
                  <span class="x-expr" data-expr="phone"><img src="xz_phone.png" alt="西装刺客，看手机一脸问号" /><img class="x-f-talk" src="xz_phone_talk.png" alt="" /><img class="x-f-blink" src="xz_phone_blink.png" alt="" /></span>
                </span>
              </span>
              </span></span></span>
              <span class="x-fx" id="fx" aria-hidden="true"></span>
            </button>
            <div class="x-scenename" id="sceneName" aria-live="polite"></div>
          </section>

          <div class="x-toast" id="toast" role="status"></div>

          <div class="x-panel">
            <div class="x-chips" role="group" aria-label="表情">
              <button class="x-chip" type="button" data-chip="cold" aria-pressed="true">冷脸</button>
              <button class="x-chip" type="button" data-chip="rock" aria-pressed="false">搞事</button>
              <button class="x-chip" type="button" data-chip="confident" aria-pressed="false">拿捏</button>
              <button class="x-chip" type="button" data-chip="shock" aria-pressed="false">震惊</button>
              <button class="x-chip" type="button" data-chip="fakesmile" aria-pressed="false">假笑</button>
              <button class="x-chip" type="button" data-chip="sneaky" aria-pressed="false">偷看</button>
              <button class="x-chip" type="button" data-chip="cool" aria-pressed="false">墨镜</button>
              <button class="x-chip" type="button" data-chip="shrug" aria-pressed="false">摊手</button>
              <button class="x-chip" type="button" data-chip="phone" aria-pressed="false">回消息</button>
            </div>
            <div class="x-actions">
              <button class="x-act primary" type="button" id="quoteBtn">抽金句</button>
              <button class="x-act" type="button" id="praiseBtn">夸他西装</button>
              <button class="x-act" type="button" id="tieBtn">扯他领带</button>
              <button class="x-act" type="button" id="voiceBtn" aria-pressed="false">🔊 朗读</button>
            </div>
            <form class="x-form" id="form" autocomplete="off">
              <input class="x-input" id="input" type="text" maxlength="60" placeholder="跟他说点什么…" aria-label="输入消息" enterkeyhint="send" />
              <button class="x-send" type="submit">发送</button>
            </form>
          </div>
        </div>
      </main>
    </div>
    <script src="hark.js"></script>
    <script>
      (function () {
        var $ = function (id) { return document.getElementById(id); };
        var EXPR_LINES = {
          cold: "有事说事。", rock: "泰裤辣。", confident: "包的。", shock: "……硬控了我三秒。",
          fakesmile: "我真的会谢。", sneaky: "嘘，我在暗处。", cool: "city不city？", shrug: "那咋了。", phone: "已读，乱回。"
        };
        var EXPRS = Object.keys(EXPR_LINES);
        var QUOTES = [
          "西装可以租，气场租不到。", "情绪可以崩，裤线不能崩。", "爱我可以，别碰我的领带。",
          "扣子扣好，再来跟我讲道理。", "我不赶时间，我赶的是档次。", "体面是一种武器。",
          "你的事我记着，你的褶子我也记着。", "安静，是最贵的配饰。"
        ];
        var POKES = [
          ["shock", "戳什么戳，这料子很贵。"], ["cold", "……手拿开。"], ["shrug", "再戳收费。"],
          ["phone", "你在戳一个很忙的人。"], ["cool", "看够了吗？没看够也不给看了。"], ["rock", "再戳，我就开始营业了。"]
        ];
        var POKES_SHY = [["sneaky", "……别闹，有人看着。"], ["sneaky", "戳完了？那我再看你一眼。"]];
        var SCENES = ["写字楼大堂", "雨夜街头", "裁缝店", "咖啡店"];

        var state = { favor: 20, voice: false, scene: 0, expr: "cold", hit50: false, hit100: false };
        var pick = function (a) { return a[Math.floor(Math.random() * a.length)]; };

        /* ---- expression ---- */
        var reduce = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : { matches: false };
        var chips = document.querySelectorAll("[data-chip]");
        var pop = $("pop"), react = $("react"), look = $("look"), fx = $("fx"), charEl = $("char");
        var groups = {};
        document.querySelectorAll(".x-expr").forEach(function (g) {
          groups[g.dataset.expr] = { el: g, talk: g.querySelector(".x-f-talk"), blink: g.querySelector(".x-f-blink") };
          g.addEventListener("animationend", function () { g.classList.remove("is-in"); });
        });
        var face = { blink: false, mouth: false }, noSwapPop = false;
        function render() {
          var g = groups[state.expr];
          g.blink.classList.toggle("on", face.blink);
          g.talk.classList.toggle("on", face.mouth && !face.blink);
        }
        function replay(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
        function setExpr(e) {
          var old = groups[state.expr];
          if (e !== state.expr) {
            old.talk.classList.remove("on"); old.blink.classList.remove("on");
            old.el.classList.remove("is-on", "is-in");
            groups[e].el.classList.add("is-on");
          }
          state.expr = e;
          render();
          if (!noSwapPop) replay(groups[e].el, "is-in");
          chips.forEach(function (c) { c.setAttribute("aria-pressed", c.dataset.chip === e ? "true" : "false"); });
        }

        /* ---- blinking ---- */
        function blinkOnce(cb) {
          face.blink = true; render();
          setTimeout(function () { face.blink = false; render(); if (cb) cb(); }, 120);
        }
        function scheduleBlink() {
          setTimeout(function () {
            blinkOnce(function () {
              if (Math.random() < 0.22) setTimeout(function () { blinkOnce(scheduleBlink); }, 150);
              else scheduleBlink();
            });
          }, 2500 + Math.random() * 3000);
        }

        /* ---- talking ---- */
        var typing = false, speaking = false, pauseUntil = 0, talkT = null;
        var PUNCT = /[，。！？、；：…,.!?;:～~—“”"]/;
        function isTalking() { return typing || (state.voice && synth && (speaking || synth.speaking)); }
        function startTalk() { if (!talkT) talkTick(); }
        function talkTick() {
          talkT = null;
          if (!isTalking()) { face.mouth = false; render(); return; }
          var now = Date.now(), wait;
          if (now < pauseUntil) { face.mouth = false; wait = Math.max(30, pauseUntil - now); }
          else { face.mouth = face.mouth ? Math.random() < 0.22 : Math.random() < 0.85; wait = 90 + Math.random() * 70; }
          render();
          talkT = setTimeout(talkTick, wait);
        }

        /* ---- typed line ---- */
        var lineEl = $("line"), caret = $("caret"), timer = null;
        function type(text) {
          clearInterval(timer);
          var chars = Array.from(text), i = 0;
          lineEl.textContent = ""; caret.style.display = "";
          typing = true; pauseUntil = 0; startTalk();
          timer = setInterval(function () {
            var ch = chars[i++];
            lineEl.textContent += ch;
            if (PUNCT.test(ch)) { pauseUntil = Date.now() + 250; face.mouth = false; render(); }
            if (i >= chars.length) { clearInterval(timer); typing = false; setTimeout(function () { caret.style.display = "none"; }, 900); }
          }, 65);
        }

        /* ---- reactions ---- */
        function imgPt(fx_, fy) {
          var w = charEl.clientWidth, h = charEl.clientHeight;
          var s = Math.min(w / 396, h / 294), iw = 396 * s, ih = 294 * s;
          return { x: (w - iw) / 2 + iw * fx_, y: h - ih + ih * fy };
        }
        function particle(cls, x, y, life, html, vars) {
          var p = document.createElement("span");
          p.className = cls; p.style.left = x + "px"; p.style.top = y + "px";
          if (html) p.innerHTML = html;
          if (vars) for (var k in vars) p.style.setProperty(k, vars[k]);
          fx.appendChild(p);
          setTimeout(function () { p.remove(); }, life);
          return p;
        }
        var HEART = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>';
        function hearts() {
          if (reduce.matches) return;
          var n = 3 + Math.floor(Math.random() * 3), c = imgPt(0.5, 0.62);
          for (var k = 0; k < n; k++) {
            var p = particle("x-hrt", c.x + (Math.random() - 0.5) * 40, c.y + (Math.random() - 0.5) * 16, 1900, HEART,
              { "--dx": ((Math.random() - 0.5) * 60).toFixed(0) + "px", "--rot": ((Math.random() - 0.5) * 40).toFixed(0) + "deg" });
            p.style.animationDelay = (k * 110) + "ms";
            p.style.transform = "scale(" + (0.8 + Math.random() * 0.4).toFixed(2) + ")";
          }
        }
        function anger() {
          if (reduce.matches) return;
          var c = imgPt(0.66, 0.1);
          particle("x-anger", c.x, c.y, 1000).textContent = "💢";
        }
        function sparkles() {
          if (reduce.matches) return;
          var n = 5 + Math.floor(Math.random() * 3), c = imgPt(0.5, 0.45), r = imgPt(1, 1);
          var rx = (r.x - c.x) * 0.62, ry = (r.y - c.y) * 0.8;
          for (var k = 0; k < n; k++) {
            var a = (k / n) * Math.PI * 2 + Math.random() * 0.6;
            var p = particle("x-spark", c.x + Math.cos(a) * rx, c.y + Math.sin(a) * ry, 1500, null,
              { "--sz": (12 + Math.random() * 12).toFixed(0) + "px" });
            p.textContent = "✦";
            p.style.animationDelay = (Math.random() * 320).toFixed(0) + "ms";
          }
        }
        function tapPop(ev) {
          var b = charEl.getBoundingClientRect(), x, y;
          if (ev && ev.detail > 0 && ev.clientX) { x = ev.clientX - b.left; y = ev.clientY - b.top; }
          else { var c = imgPt(0.5, 0.5); x = c.x; y = c.y; }
          pop.style.transformOrigin = x.toFixed(0) + "px " + y.toFixed(0) + "px";
          replay(pop, "go");
          if (!reduce.matches) particle("x-ripple", x, y, 600);
        }
        function reactWith(cls) { react.classList.remove("hop", "shake"); void react.offsetWidth; react.classList.add(cls); }

        /* ---- idle look ---- */
        function scheduleLook() {
          setTimeout(function () {
            if (!reduce.matches) {
              var dir = Math.random() < 0.5 ? -1 : 1;
              look.style.transform = "rotate(" + (dir * (0.6 + Math.random() * 0.8)).toFixed(2) + "deg) translateX(" + (dir * (2 + Math.random() * 3)).toFixed(1) + "px)";
              setTimeout(function () { look.style.transform = ""; }, 1300 + Math.random() * 1400);
            }
            scheduleLook();
          }, 8000 + Math.random() * 4000);
        }

        /* ---- voice ---- */
        var synth = window.speechSynthesis || null, voice = null;
        function chooseVoice() {
          if (!synth) return;
          var vs = synth.getVoices().filter(function (v) { return /zh/i.test(v.lang); });
          var male = vs.filter(function (v) { return /male|男|yunxi|yunyang|yunjian|kangkang|li-mu|liang|zhiwei|yu-shu/i.test(v.name) && !/female|女/i.test(v.name); });
          voice = male[0] || vs.filter(function (v) { return /zh-CN|zh_CN/i.test(v.lang); })[0] || vs[0] || null;
        }
        if (synth) { chooseVoice(); if ("onvoiceschanged" in synth) synth.onvoiceschanged = chooseVoice; }
        function speak(text) {
          if (!state.voice || !synth || typeof SpeechSynthesisUtterance === "undefined") return;
          try {
            synth.cancel();
            var u = new SpeechSynthesisUtterance(text);
            u.lang = "zh-CN"; u.pitch = 0.8; u.rate = 0.9;
            if (voice) u.voice = voice;
            u.onstart = function () { speaking = true; startTalk(); };
            u.onend = u.onerror = function () { speaking = false; };
            synth.speak(u);
            startTalk();
          } catch (err) {}
        }

        function say(e, text) { setExpr(e); type(text); speak(text); }

        /* ---- favor ---- */
        var toastEl = $("toast"), toastT;
        function toast(msg) {
          toastEl.textContent = msg; toastEl.classList.add("show");
          clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove("show"); }, 2400);
        }
        function addFavor(n) {
          var prev = state.favor;
          state.favor = Math.max(0, Math.min(100, prev + n));
          var d = state.favor - prev;
          $("fill").style.width = state.favor + "%";
          $("num").textContent = state.favor;
          $("favor").setAttribute("aria-valuenow", state.favor);
          if (d !== 0) {
            var f = document.createElement("span");
            f.className = "x-float " + (d > 0 ? "up" : "down");
            f.textContent = (d > 0 ? "+" : "−") + Math.abs(d);
            $("favor").appendChild(f);
            setTimeout(function () { f.remove(); }, 1200);
            if (d > 0) { var h = $("heart"); h.classList.remove("beat"); void h.getBoundingClientRect(); h.classList.add("beat"); }
          }
          if (!state.hit50 && prev < 50 && state.favor >= 50) { state.hit50 = true; toast("解锁：他会偷看你了"); }
          if (!state.hit100 && state.favor >= 100) { state.hit100 = true; toast("满好感！他笑了"); return true; }
          return false;
        }
        function respond(n, e, text) {
          if (n && addFavor(n)) { say("fakesmile", "……行吧，就你了。"); return; }
          say(e, text);
        }

        /* ---- controls ---- */
        chips.forEach(function (c) {
          c.addEventListener("click", function () { say(c.dataset.chip, EXPR_LINES[c.dataset.chip]); c.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" }); });
        });
        $("char").addEventListener("click", function (ev) {
          var pool = state.favor >= 50 ? POKES.concat(POKES_SHY) : POKES;
          var r = pick(pool);
          tapPop(ev);
          noSwapPop = true; respond(1, r[0], r[1]); noSwapPop = false;
        });
        $("quoteBtn").addEventListener("click", function () { respond(2, pick(EXPRS), pick(QUOTES)); sparkles(); });
        $("praiseBtn").addEventListener("click", function () {
          var r = pick([["confident", "眼光不错，算你识货。"], ["sneaky", "……别夸了，裤线要崩了。"], ["confident", "这套是定制的，你懂就好。"]]);
          respond(8, r[0], r[1]);
          hearts(); reactWith("hop");
        });
        $("tieBtn").addEventListener("click", function () {
          var r = pick([["shock", "爱我可以，别碰我的领带。"], ["fakesmile", "爱我可以，别碰我的领带。"]]);
          respond(-10, r[0], r[1]);
          reactWith("shake"); anger();
        });
        $("voiceBtn").addEventListener("click", function () {
          if (!synth) { toast("这台设备不支持朗读"); return; }
          state.voice = !state.voice;
          this.setAttribute("aria-pressed", state.voice ? "true" : "false");
          if (state.voice) { chooseVoice(); speak(lineEl.textContent || "在。"); toast("朗读已开启"); }
          else { synth.cancel(); toast("朗读已关闭"); }
        });

        $("form").addEventListener("submit", function (ev) {
          ev.preventDefault();
          var inp = $("input"), t = inp.value.trim();
          if (!t) return;
          inp.value = "";
          if (/你好|在吗|hello|hi|嗨/i.test(t)) respond(0, "cold", "在。说。");
          else if (/累|难过|烦|哭|丧|崩溃/.test(t)) respond(1, "cold", pick(["坐下，领带松一点，天塌了我先扛。", "累了就歇，体面我替你撑着。", "别硬撑。我在，西装也在。"]));
          else if (/喜欢|爱/.test(t)) respond(3, "sneaky", "……先把你衬衫熨平再说。");
          else if (/帅|好看|西装/.test(t)) respond(5, "confident", pick(["这还用你说。", "眼光不错，算你识货。"]));
          else respond(0, pick(EXPRS), pick(QUOTES));
        });

        /* ---- scenes ---- */
        var scenes = document.querySelectorAll(".x-scene"), nameEl = $("sceneName"), nameT;
        $("sceneBtn").addEventListener("click", function () {
          scenes[state.scene].classList.remove("is-on");
          state.scene = (state.scene + 1) % scenes.length;
          scenes[state.scene].classList.add("is-on");
          nameEl.textContent = SCENES[state.scene]; nameEl.classList.add("show");
          clearTimeout(nameT); nameT = setTimeout(function () { nameEl.classList.remove("show"); }, 1400);
        });
        var rain = $("rainScene");
        for (var i = 0; i < 46; i++) {
          var d = document.createElement("span");
          d.className = "x-drop";
          d.style.left = (Math.random() * 120) + "%";
          d.style.height = (18 + Math.random() * 20) + "px";
          d.style.animationDuration = (0.55 + Math.random() * 0.5) + "s";
          d.style.animationDelay = (-Math.random() * 1.2) + "s";
          d.style.opacity = (0.4 + Math.random() * 0.6).toFixed(2);
          rain.appendChild(d);
        }

        /* ---- start ---- */
        type("我是西装刺客。别碰我的领带。");
        scheduleBlink();
        scheduleLook();
      })();
    </script>
  </body>
</html>
