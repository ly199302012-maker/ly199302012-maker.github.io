<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d1d1f" />
    <title>西装刺客真人养成空间</title>
    <link rel="stylesheet" href="hark.css" />
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; }
      body { overflow: hidden; }
      .page.x-app {
        max-width: 480px;
        height: 100dvh;
        padding: max(10px, env(safe-area-inset-top)) 14px max(10px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
      }

      /* title bar + affection meter */
      .x-top { display: flex; align-items: center; gap: 12px; }
      .x-title { font: var(--type-label); flex: 1; white-space: nowrap; }
      .x-title span { color: var(--text-secondary); font-weight: var(--weight-regular); }
      .x-meter { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .x-meter__label { font: var(--type-tag); white-space: nowrap; font-variant-numeric: tabular-nums; }
      .x-meter__track { width: 84px; height: 6px; border-radius: var(--r-pill); background: var(--fill-tertiary); overflow: hidden; }
      .x-meter__fill { height: 100%; width: 0; border-radius: inherit; background: var(--fill-system-red); transition: width 400ms var(--ease-out); }
      .x-meter.is-bump .x-meter__label { animation: x-bump 400ms var(--ease-out); }
      @keyframes x-bump { 40% { transform: scale(1.18); } }

      /* stage */
      .x-stagebox { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; }
      .x-stage {
        position: relative;
        height: 100%;
        max-height: calc((100vw - 28px) * 4 / 3);
        aspect-ratio: 3 / 4;
        max-width: 100%;
        border-radius: var(--r-l);
        overflow: hidden;
        background: var(--fill-tertiary);
        border: 1px solid var(--stroke-primary);
        touch-action: manipulation;
        cursor: pointer;
        isolation: isolate;
      }
      .x-breath { position: absolute; inset: 0; transform-origin: 50% 100%; animation: x-breathe 4s ease-in-out infinite; }
      .x-stage.is-video .x-breath { animation: none; }
      @keyframes x-breathe { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2px) scale(1.012); } }
      .x-scene { position: absolute; inset: 0; opacity: 0; transition: opacity 400ms ease; pointer-events: none; }
      .x-scene.is-on { opacity: 1; }
      .x-drift { position: absolute; inset: 0; animation: x-drift 24s ease-in-out infinite alternate; }
      @keyframes x-drift { from { transform: scale(1.02) translate(0, 0); } to { transform: scale(1.05) translate(-0.8%, -0.6%); } }
      .x-drift img, .x-drift video { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: cover; }
      .x-layer-b, .x-layer-s { opacity: 0; }
      .x-layer-b { transition: opacity 40ms linear; }
      .x-layer-s { transition: opacity 90ms ease; }
      .x-scene.is-smile .x-layer-s { transition-duration: 300ms; }
      .x-stage.is-shake { animation: x-shake 360ms ease; }
      @keyframes x-shake { 20% { transform: translateX(-6px) rotate(-0.6deg); } 40% { transform: translateX(5px) rotate(0.5deg); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }

      /* effects */
      .x-fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }
      .x-ripple { position: absolute; width: 80px; height: 80px; margin: -40px 0 0 -40px; border-radius: 50%; border: 2px solid rgb(245 245 247 / 0.85); animation: x-ripple 600ms var(--ease-out) forwards; }
      @keyframes x-ripple { from { transform: scale(0.2); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
      .x-heart { position: absolute; bottom: 18%; font-size: 22px; color: color-mix(in srgb, var(--fill-system-red) 60%, #ffffff); animation: x-rise 1.8s ease-out forwards; }
      @keyframes x-rise { 0% { transform: translate(0, 0) scale(0.6); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--dx), -220px) scale(1.2); opacity: 0; } }
      .x-spark { position: absolute; font-size: 20px; animation: x-spark 900ms var(--ease-out) forwards; }
      @keyframes x-spark { from { transform: translate(0, 0) scale(0.4); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1.1); opacity: 0; } }
      .x-anger { position: absolute; top: 14%; right: 16%; font-size: 40px; animation: x-anger 1.1s ease forwards; }
      @keyframes x-anger { 0% { transform: scale(0.3); opacity: 0; } 20% { transform: scale(1.2); opacity: 1; } 35%, 70% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }

      /* speech bubble */
      .x-bubble {
        position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 4;
        padding: 12px 14px; min-height: 22px;
        border-radius: var(--r-m);
        background: rgb(22 22 24 / 0.58);
        -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
        border: 1px solid rgb(245 245 247 / 0.16);
        color: #f5f5f7; font: var(--type-body-strong);
        opacity: 0; transform: translateY(8px);
        transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out);
        pointer-events: none;
      }
      .x-bubble.is-on { opacity: 1; transform: none; }
      .x-bubble__who { display: block; font: var(--type-tag); color: rgb(245 245 247 / 0.7); margin-bottom: 2px; }
      .x-bubble__text::after { content: "▍"; opacity: 0.6; margin-left: 1px; }
      .x-bubble.is-done .x-bubble__text::after { content: ""; }
      .x-sound {
        position: absolute; top: 10px; right: 10px; z-index: 5;
        width: var(--tap); height: var(--tap); border-radius: 50%; border: 1px solid rgb(245 245 247 / 0.2);
        background: rgb(22 22 24 / 0.5); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
        color: #f5f5f7; font-size: 18px; display: none; cursor: pointer;
      }
      .x-stage.is-video .x-sound { display: block; }

      /* scene chips */
      .x-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: -2px; scroll-snap-type: x proximity; flex-shrink: 0; }
      .x-chips::-webkit-scrollbar { display: none; }
      .x-chip {
        flex: none; display: flex; align-items: center; gap: 8px; scroll-snap-align: start;
        min-height: var(--tap); padding: 4px 12px 4px 4px;
        border-radius: var(--r-pill); border: 1px solid var(--stroke-primary);
        background: var(--fill-tertiary); color: var(--text-primary);
        font: var(--type-tag); cursor: pointer;
        transition: background var(--dur-quick) var(--ease-out), color var(--dur-quick) var(--ease-out);
      }
      .x-chip img, .x-chip .x-chip__emoji { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex: none; }
      .x-chip .x-chip__emoji { display: grid; place-items: center; background: var(--fill-primary-on); font-size: 18px; }
      .x-chip.is-active { background: var(--fill-primary); color: var(--text-primary-on); border-color: transparent; }
      .x-chip.is-locked { color: var(--text-secondary); }
      .x-chip.is-locked img, .x-chip.is-locked .x-chip__emoji { filter: grayscale(1) brightness(0.45); }
      .x-chip small { font: var(--type-caption); color: var(--text-secondary); }
      .x-chip.is-new { animation: x-bump 500ms var(--ease-out) 2; }

      /* actions */
      .x-actions { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 8px; flex-shrink: 0; }
      .x-act {
        min-height: 48px; border-radius: var(--r-m); border: 1px solid var(--stroke-primary);
        background: var(--fill-tertiary); color: var(--text-primary); font: var(--type-label);
        cursor: pointer; padding: 0 8px; white-space: nowrap;
        transition: transform var(--dur-quick) var(--ease-out);
      }
      .x-act:active { transform: scale(0.96); }
      .x-act--voice { padding: 0 12px; font: var(--type-tag); }
      .x-act--voice[aria-pressed="true"] { background: var(--fill-primary); color: var(--text-primary-on); border-color: transparent; }

      /* chat */
      .x-chat { display: flex; gap: 8px; flex-shrink: 0; margin: 0; }
      .x-chat input {
        flex: 1; min-width: 0; min-height: 48px; padding: 0 16px;
        border-radius: var(--r-pill); border: 1px solid var(--stroke-primary);
        background: var(--fill-tertiary); color: var(--text-primary);
        font: var(--weight-regular) 16px/1.3 var(--sans); -webkit-user-select: text; user-select: text;
      }
      .x-chat input::placeholder { color: var(--text-secondary); }
      .x-chat button {
        min-height: 48px; padding: 0 20px; border-radius: var(--r-pill); border: 0;
        background: var(--fill-primary); color: var(--text-primary-on); font: var(--type-label); cursor: pointer;
      }

      /* toast + finale glow */
      .x-toast {
        position: fixed; left: 50%; top: max(56px, calc(env(safe-area-inset-top) + 46px)); z-index: 20;
        transform: translate(-50%, -10px); opacity: 0; pointer-events: none;
        padding: 10px 16px; border-radius: var(--r-pill);
        background: var(--mat-agent); -webkit-backdrop-filter: var(--hark-blur); backdrop-filter: var(--hark-blur);
        border: 1px solid var(--stroke-primary); box-shadow: var(--hark-shadow);
        font: var(--type-label); white-space: nowrap;
        transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out);
      }
      .x-toast.is-on { opacity: 1; transform: translate(-50%, 0); }
      .x-glow {
        position: fixed; inset: 0; z-index: 30; pointer-events: none; opacity: 0;
        background: radial-gradient(circle at 50% 42%, rgb(255 214 170 / 0.55), rgb(241 85 91 / 0.28) 45%, transparent 75%);
        display: grid; place-items: center;
      }
      .x-glow.is-on { animation: x-glow 4.2s ease forwards; }
      .x-glow p { font: var(--type-heading); color: #f5f5f7; text-align: center; padding: 0 32px; text-shadow: 0 2px 16px rgb(0 0 0 / 0.5); }
      @keyframes x-glow { 0% { opacity: 0; } 15%, 75% { opacity: 1; } 100% { opacity: 0; } }

      .x-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

      @media (prefers-reduced-motion: reduce) {
        .x-breath, .x-drift { animation: none; }
        .x-stage.is-shake { animation: none; }
        .x-scene { transition-duration: 1ms; }
      }
    </style>
  </head>

      (function () {

        SCENES.forEach(function (s, i) { if (!s.need) state.unlocked[i] = true; });

        /* ---------- toast ---------- */

        function blinkOnce(done) {
          var l = layers(); if (!l.b) return done && done();

        function blinkLoop() {
          setTimeout(function () {

              blinkOnce(function () { if (Math.random() < 0.25) setTimeout(blinkOnce, 120); });

        var smileUntil = 0, talkTimer = null, talkUntil = 0, talkOn = false;
        function applySmile() {
          var l = layers(); if (!l.s) return;
          var now = Date.now();
          if (now < smileUntil) { l.s.style.opacity = 1; return; }
          if (now < talkUntil) { l.s.style.opacity = talkOn ? 0.85 : 0; return; }
          l.s.style.opacity = 0;
        }
        function smile(ms) {
          smileUntil = Date.now() + ms;
          scenes[state.cur].classList.add("is-smile");
          applySmile();
          setTimeout(function () { scenes[state.cur].classList.remove("is-smile"); applySmile(); }, ms + 20);
        }
        function talk(ms) {
          talkUntil = Date.now() + ms;
          if (talkTimer) return;
          talkTimer = setInterval(function () {
            talkOn = !talkOn;
            applySmile();
            if (Date.now() >= talkUntil) { clearInterval(talkTimer); talkTimer = null; talkOn = false; applySmile(); }
          }, 180);
        }
        function resetFace() {
          scenes.forEach(function (sc) {
            var b = sc.querySelector(".x-layer-b"), s = sc.querySelector(".x-layer-s");
            if (b) b.style.opacity = 0; if (s) s.style.opacity = 0;
          });
        }

        /* ---------- speech bubble ---------- */
        var typeTimer = null, hideTimer = null;
        function say(line) {
          clearInterval(typeTimer); clearTimeout(hideTimer);
          var chars = Array.from(line), i = 0, step = 70;
          bubbleText.textContent = "";
          bubble.classList.remove("is-done");
          bubble.classList.add("is-on");
          talk(chars.length * step + 200);
          typeTimer = setInterval(function () {
            i++; bubbleText.textContent = chars.slice(0, i).join("");
            if (i >= chars.length) {
              clearInterval(typeTimer); bubble.classList.add("is-done");
              hideTimer = setTimeout(function () { bubble.classList.remove("is-on"); }, 2600 + chars.length * 60);
            }
          }, step);
          speak(line);
        }

        /* ---------- voice ---------- */
        var voice = null;
        function chooseVoice() {
          if (!("speechSynthesis" in window)) return;
          var vs = speechSynthesis.getVoices().filter(function (v) { return /^zh/i.test(v.lang); });
          var cn = vs.filter(function (v) { return /zh[-_]CN/i.test(v.lang); });
          var pool = cn.length ? cn : vs;
          var male = pool.filter(function (v) { return /male|男|yunxi|yunyang|yunjian|kangkang|li-mu|limu|liang|xiaoyu|han|yu-shu/i.test(v.name) && !/female|女/i.test(v.name); });
          voice = male[0] || pool[0] || null;
        }
        if ("speechSynthesis" in window) { chooseVoice(); speechSynthesis.onvoiceschanged = chooseVoice; }
        function speak(line) {
          if (!state.voice || !("speechSynthesis" in window)) return;
          try {
            speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(line);
            u.lang = voice ? voice.lang : "zh-CN"; if (voice) u.voice = voice;
            u.rate = 1.0; u.pitch = 0.9;
            speechSynthesis.speak(u);
          } catch (e) {}
        }
        $("act-voice").addEventListener("click", function () {
          state.voice = !state.voice;
          this.setAttribute("aria-pressed", state.voice);
          if (!("speechSynthesis" in window)) { toast("这台设备不支持朗读"); return; }
          if (state.voice) { chooseVoice(); speak("朗读已开启。"); toast("朗读已开启"); }
          else { speechSynthesis.cancel(); toast("朗读已关闭"); }
        });

        /* ---------- effects ---------- */
        function shake() {
          if (reduce.matches) return;
          stage.classList.remove("is-shake"); void stage.offsetWidth; stage.classList.add("is-shake");
        }
        function spawn(cls, text, style, life) {
          var el = document.createElement("span"); el.className = cls; el.textContent = text || "";
          for (var k in style) el.style.setProperty(k, style[k]);
          fx.appendChild(el); setTimeout(function () { el.remove(); }, life);
        }
        function anger() { spawn("x-anger", "💢", {}, 1200); }
        function hearts() {
          for (var i = 0; i < 7; i++) (function (i) {
            setTimeout(function () {
              spawn("x-heart", "❤", { left: rand(25, 70) + "%", "--dx": rand(-40, 40) + "px", "font-size": rand(16, 30) + "px" }, 1900);
            }, i * 140);
          })(i);
        }
        function sparkles() {
          for (var i = 0; i < 12; i++) {
            var a = (Math.PI * 2 * i) / 12 + rand(-0.2, 0.2), d = rand(60, 130);
            spawn("x-spark", "✨", { left: "50%", top: "45%", "--dx": Math.cos(a) * d + "px", "--dy": Math.sin(a) * d + "px" }, 950);
          }
        }

        /* ---------- affection ---------- */
        function addLove(n) {
          var before = state.love;
          state.love = Math.max(0, Math.min(100, state.love + n));
          $("meter-label").textContent = "好感度 " + state.love;
          $("meter-fill").style.width = state.love + "%";
          $("meter").setAttribute("aria-valuenow", state.love);
          var m = $("meter"); m.classList.remove("is-bump"); void m.offsetWidth; if (n) m.classList.add("is-bump");
          SCENES.forEach(function (s, i) {
            if (!state.unlocked[i] && state.love >= s.need) {
              state.unlocked[i] = true;
              renderChips(i);
              toast("🔓 解锁新装扮：" + s.name);
            }
          });
          if (state.love >= 100 && before < 100 && !state.finale) {
            state.finale = true;
            setTimeout(function () {
              $("glow").classList.add("is-on");
              smile(3000); say("行，你赢了。以后我只给你一个人接单。");
            }, 900);
          }
        }

        /* ---------- scene chips ---------- */
        var chipsEl = $("chips");
        var chipEls = Array.prototype.slice.call(chipsEl.querySelectorAll(".x-chip"));
        chipEls.forEach(function (b, i) { b.addEventListener("click", function () { choose(i); }); });
        function renderChips(fresh) {
          SCENES.forEach(function (s, i) {
            var b = chipEls[i], open = !!state.unlocked[i];
            b.classList.toggle("is-active", i === state.cur);
            b.classList.toggle("is-locked", !open);
            if (i === fresh) b.classList.add("is-new");
            var lock = b.querySelector("small");
            if (open && lock) lock.remove();
            b.setAttribute("aria-label", open ? "换装：" + s.name : s.name + "，好感度到 " + s.need + " 解锁");
            if (i === state.cur) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
          });
        }
        function choose(i) {
          var s = SCENES[i];
          if (!state.unlocked[i]) { toast("好感度到 " + s.need + " 解锁"); return; }
          if (i === state.cur) { say(s.hi); return; }
          scenes[state.cur].classList.remove("is-on");
          state.cur = i;
          resetFace(); smileUntil = 0;
          scenes[i].classList.add("is-on");
          stage.classList.toggle("is-video", !!s.video);
          if (s.video) { var p = video.play(); if (p && p.catch) p.catch(function () {}); }
          else { video.pause(); }
          renderChips();
          var chip = chipsEl.children[i];
          if (chip && chip.scrollIntoView) chip.scrollIntoView({ behavior: reduce.matches ? "auto" : "smooth", inline: "center", block: "nearest" });
          setTimeout(function () { say(s.hi); }, 400);
        }
        soundBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          video.muted = !video.muted;
          soundBtn.textContent = video.muted ? "🔇" : "🔊";
          soundBtn.setAttribute("aria-label", video.muted ? "打开视频声音" : "关闭视频声音");
          var p = video.play(); if (p && p.catch) p.catch(function () {});
        });

        /* ---------- poke ---------- */
        function poke(x, y) {
          var now = Date.now();
          spawn("x-ripple", "", { left: x + "px", top: y + "px" }, 650);
          shake();
          state.pokes = state.pokes.filter(function (t) { return now - t < 2000; });
          state.pokes.push(now);
          state.pokeGain = state.pokeGain.filter(function (t) { return now - t < 10000; });
          if (state.pokeGain.length < 5) { state.pokeGain.push(now); addLove(1); }
          if (state.pokes.length >= 3) {
            state.pokes = [];
            anger(); say(pick(ANNOYED));
          } else {
            smile(1200); say(pick(POKE));
          }
        }
        stage.addEventListener("click", function (e) {
          if (e.target.closest(".x-sound")) return;
          var r = stage.getBoundingClientRect();
          poke(e.clientX - r.left, e.clientY - r.top);
        });
        stage.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); poke(stage.clientWidth / 2, stage.clientHeight / 2); }
        });

        /* ---------- actions ---------- */
        $("act-quote").addEventListener("click", function () { sparkles(); say(pick(QUOTES)); addLove(1); });
        $("act-praise").addEventListener("click", function () { smile(1800); hearts(); say(pick(PRAISE)); addLove(3); });
        $("act-tie").addEventListener("click", function () { shake(); anger(); say(pick(TIE)); addLove(-2); });

        /* ---------- chat ---------- */
        $("chat").addEventListener("submit", function (e) {
          e.preventDefault();
          var inp = $("chat-input"), msg = inp.value.trim();
          if (!msg) return;
          inp.value = "";
          var reply = null;
          for (var i = 0; i < CHAT.length && !reply; i++) {
            if (CHAT[i].k.some(function (k) { return msg.indexOf(k) !== -1; })) reply = pick(CHAT[i].r);
          }
          say(reply || pick(DEFAULT));
          addLove(2);
        });

        renderChips();
        blinkLoop();
        setTimeout(function () { say(SCENES[0].hi); }, 600);
      })();
    </script>
  </body>
</html>
