<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>西装刺客 · 全息投影｜蓝调型男</title>
<meta name="description" content="微信表情「西装刺客日常」的全息投影版，手指拖动可旋转。" />
<style>
  html,body{margin:0;height:100%;background:#02060b;overflow:hidden;font-family:-apple-system,"PingFang SC",sans-serif;color:#7ff6ff}
  canvas{display:block;touch-action:none}
  .hud{position:fixed;left:0;right:0;top:18px;text-align:center;pointer-events:none;letter-spacing:.3em;font-size:12px;opacity:.75;text-shadow:0 0 8px #2ef}
  .hud b{display:block;font-size:22px;letter-spacing:.35em;margin-top:6px;font-weight:600}
  .tip{position:fixed;left:0;right:0;bottom:16px;text-align:center;font-size:12px;opacity:.55;letter-spacing:.2em;pointer-events:none}
  #fb{display:none;position:fixed;inset:0;perspective:900px;align-items:center;justify-content:center;flex-direction:column}
  #fb .stage{position:relative;width:72vw;max-width:340px;transform-style:preserve-3d;animation:sway 6s ease-in-out infinite}
  #fb img{width:100%;display:block;filter:sepia(1) hue-rotate(140deg) saturate(6) brightness(1.3) drop-shadow(0 0 12px #2ef);mix-blend-mode:screen;opacity:.85;animation:flick 3s infinite}
  #fb .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 2px,transparent 2px 4px);pointer-events:none}
  #fb .beam{width:80vw;max-width:380px;height:40px;margin-top:-6px;border-radius:50%;background:radial-gradient(ellipse,#3ff3ff 0,rgba(63,243,255,.25) 40%,transparent 70%);box-shadow:0 0 40px #2ef}
  @keyframes sway{0%,100%{transform:rotateY(-25deg) translateY(0)}50%{transform:rotateY(25deg) translateY(-8px)}}
  @keyframes flick{0%,100%{opacity:.85}47%{opacity:.85}48%{opacity:.4}49%{opacity:.9}}
</style>
</head>
<body>
<div class="hud">HOLO · PROJECTION<b>西装刺客</b></div>
<div class="tip">拖动旋转 · 微信表情搜「西装刺客日常」</div>
<div id="fb"><div class="stage"><img src="holo-cike.png" alt="西装刺客全息"><div class="scan"></div></div><div class="beam"></div></div>
<script type="module">
function fallback(){document.getElementById("fb").style.display="flex";}
const _c=document.createElement("canvas");
if(!(_c.getContext("webgl2")||_c.getContext("webgl"))){fallback();throw new Error("no webgl");}
let THREE;
try { THREE = await import('https://registry.npmmirror.com/three/0.160.0/files/build/three.module.min.js'); }
catch(e){ try{ THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js'); }catch(e2){ fallback(); throw e2; } }

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x02060b,0.06);
const camera = new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,100);
function fitCam(){ const portrait = innerHeight>innerWidth; camera.position.set(0,1.55, portrait?9.2:7); camera.lookAt(0,1.45,0); }
fitCam();

const CYAN = new THREE.Color(0x3ff3ff);
const holo = new THREE.Group(); scene.add(holo);

// ---- character as depth particles (Depth Anything v2 depth map)
const H=2.6, W=H*520/484;
function loadImg(src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src;});}
const [ci,di]=await Promise.all([loadImg('holo-cike.png'),loadImg('holo-cike-depth.png')]);
function px(img){const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');x.drawImage(img,0,0);return x.getImageData(0,0,c.width,c.height).data;}
const cd=px(ci), dd=px(di), IW=ci.width, IH=ci.height, STEP=2, DEPTH=1.1;
const P=[], L=[], R=[];
for(let y=0;y<IH;y+=STEP)for(let x=0;x<IW;x+=STEP){const k=(y*IW+x)*4; if(cd[k+3]<30)continue;
  const lum=cd[k]/255, d=dd[k]/255;
  P.push((x/IW-.5)*W+(Math.random()-.5)*.006, .35+(1-y/IH)*H, (d-.5)*DEPTH+(Math.random()-.5)*.02);
  L.push(lum); R.push(Math.random());}
const cg=new THREE.BufferGeometry();
cg.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
cg.setAttribute('aLum',new THREE.Float32BufferAttribute(L,1));
cg.setAttribute('aRnd',new THREE.Float32BufferAttribute(R,1));
const cu={uTime:{value:0},uColor:{value:CYAN},uGlitch:{value:0},uPR:{value:renderer.getPixelRatio()}};
const charMat=new THREE.ShaderMaterial({uniforms:cu,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  vertexShader:`uniform float uTime; uniform float uGlitch; uniform float uPR; attribute float aLum; attribute float aRnd; varying float vL; varying float vA;
    void main(){ vec3 p=position;
      float band=step(.96,fract(sin(floor(p.y*30.)+floor(uTime*12.))*43758.5));
      p.x+=uGlitch*band*(aRnd-.5)*.25;
      p+=normalize(vec3(aRnd-.5,.2,fract(aRnd*7.)-.5))*.01*sin(uTime*2.+aRnd*30.);
      vec4 mv=modelViewMatrix*vec4(p,1.);
      float sweep=1.-smoothstep(0.,.08,abs(fract(uTime*.18)*3.2-(p.y-.2)));
      vL=aLum; vA=(.35+aLum*.75)*(.85+.15*sin(uTime*37.+aRnd*6.))+sweep*.9;
      gl_PointSize=(1.6+aLum*1.6+sweep*2.)*uPR*(6./-mv.z);
      gl_Position=projectionMatrix*mv; }`,
  fragmentShader:`uniform vec3 uColor; varying float vL; varying float vA;
    void main(){ float r=length(gl_PointCoord-.5); if(r>.5)discard; float a=smoothstep(.5,0.,r)*vA;
      gl_FragColor=vec4(uColor*(.6+vL*.8)*a,a); }`});
const charPts=new THREE.Points(cg,charMat); holo.add(charPts);
// ---- projector base
const base=new THREE.Group(); scene.add(base);
const disc=new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.4,.18,64), new THREE.MeshBasicMaterial({color:0x061620}));
disc.position.y=.09; base.add(disc);
function ring(r,w,op){ const m=new THREE.Mesh(new THREE.RingGeometry(r,r+w,96), new THREE.MeshBasicMaterial({color:CYAN,transparent:true,opacity:op,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false})); m.rotation.x=-Math.PI/2; m.position.y=.185; base.add(m); return m; }
const r1=ring(1.05,.035,.9), r2=ring(.75,.02,.6), r3=ring(1.25,.012,.5);
// tick marks ring
const ticks=new THREE.Group(); base.add(ticks);
for(let i=0;i<48;i++){ const b=new THREE.Mesh(new THREE.PlaneGeometry(.025,.12), new THREE.MeshBasicMaterial({color:CYAN,transparent:true,opacity:.55,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,depthWrite:false}));
  const a=i/48*Math.PI*2; b.position.set(Math.cos(a)*.9,.19,Math.sin(a)*.9); b.rotation.x=-Math.PI/2; b.rotation.z=-a; ticks.add(b); }

// ---- light cone
const coneMat=new THREE.ShaderMaterial({ transparent:true, depthWrite:false, side:THREE.DoubleSide, blending:THREE.AdditiveBlending,
  uniforms:{uTime:{value:0},uColor:{value:CYAN}},
  vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform float uTime; uniform vec3 uColor; varying vec2 vUv;
    void main(){ float a=pow(1.-vUv.y,1.6)*.22; a*=.75+.25*sin(vUv.x*60.+uTime*2.); gl_FragColor=vec4(uColor*a,a);}`});
const cone=new THREE.Mesh(new THREE.CylinderGeometry(1.55,1.0,3.4,64,1,true),coneMat);
cone.position.y=.2+1.7; scene.add(cone);

// ---- particles
const N=420, pos=new Float32Array(N*3), spd=new Float32Array(N);
for(let i=0;i<N;i++){ const r=Math.sqrt(Math.random())*1.4, a=Math.random()*6.283; pos[i*3]=Math.cos(a)*r; pos[i*3+1]=Math.random()*3.6; pos[i*3+2]=Math.sin(a)*r; spd[i]=.15+Math.random()*.45; }
const pg=new THREE.BufferGeometry(); pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
const pts=new THREE.Points(pg,new THREE.PointsMaterial({color:CYAN,size:.035,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(pts);

// ---- floor grid
const grid=new THREE.GridHelper(30,60,0x0b4a55,0x07262d); grid.material.transparent=true; grid.material.opacity=.5; scene.add(grid);

// ---- drag to rotate
let rotY=0, vel=0, drag=false, lx=0, idle=0;
const el=renderer.domElement;
el.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;el.setPointerCapture(e.pointerId);});
el.addEventListener('pointermove',e=>{ if(!drag)return; const dx=e.clientX-lx; lx=e.clientX; vel=dx*.006; rotY+=vel; idle=0; });
el.addEventListener('pointerup',()=>drag=false);

addEventListener('resize',()=>{ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); fitCam(); });

const clock=new THREE.Clock(); let glitchT=0;
function tick(){
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  idle+=dt;
  if(!drag){ vel*=.94; rotY+=vel; if(idle>2) rotY+= (Math.sin(t*.4)*.9 - rotY)*.01; }
  holo.rotation.y=rotY;
  holo.position.y=Math.sin(t*1.4)*.04;
  glitchT-=dt; if(Math.random()<.008) glitchT=.18;
  const g=glitchT>0?1:0;
  cu.uTime.value=t; cu.uGlitch.value=g;
  coneMat.uniforms.uTime.value=t;
  r1.rotation.z=t*.4; ticks.rotation.y=-t*.25; r2.material.opacity=.4+.3*Math.sin(t*3.);
  const p=pg.attributes.position.array;
  for(let i=0;i<N;i++){ p[i*3+1]+=spd[i]*dt; if(p[i*3+1]>3.6) p[i*3+1]=.2; }
  pg.attributes.position.needsUpdate=true;
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
